[project]
name = "tokenkit"
version = "0.1.0"
description = "Design tokens read from any theme shape, paired from real code and measured against WCAG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["design-tokens", "contrast", "wcag", "accessibility", "theme"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenkit"]
