[project]
name = "audiolib"
version = "0.1.0"
description = "Engine-agnostic sound-effect synthesis primitives and audio I/O."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["sfx", "audio", "synthesis", "ogg", "game-audio"]
dependencies = ["numpy>=2.0", "soundfile>=0.12", "pillow>=11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiolib"]
