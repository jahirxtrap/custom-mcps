[project]
name = "loaderkit"
version = "0.1.0"
description = "Read-only toolkit for multiloader mod workspaces: scan, parse, compare loaders, checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["minecraft", "modding", "multiloader", "gradle"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loaderkit"]
