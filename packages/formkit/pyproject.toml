[project]
name = "formkit"
version = "0.1.0"
description = "Spec-driven low-poly 3D primitives, a software preview renderer, and design guidance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["3d", "low-poly", "procedural", "blockout", "godot"]
dependencies = ["pillow>=11.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formkit"]
