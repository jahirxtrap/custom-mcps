[project]
name = "pixellib"
version = "0.1.0"
description = "Engine-agnostic pixel-art primitives: grid, color ramps, shading, outline, preview."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["pixel-art", "sprites", "pillow", "image"]
dependencies = ["pillow>=11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixellib"]
