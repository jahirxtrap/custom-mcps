[project]
name = "custom-mcps"
version = "0"
description = "Personal collection of standalone, engine-agnostic MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pixellib",
    "pixelart-mcp",
    "audiolib",
    "sfx-mcp",
    "loaderkit",
    "modkit-mcp",
    "i18nkit",
    "i18n-mcp",
    "convkit",
    "devkit-mcp",
    "studykit",
    "study-mcp",
    "formkit",
    "buildkit-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[tool.uv.sources]
pixellib = { workspace = true }
pixelart-mcp = { workspace = true }
audiolib = { workspace = true }
sfx-mcp = { workspace = true }
loaderkit = { workspace = true }
modkit-mcp = { workspace = true }
i18nkit = { workspace = true }
i18n-mcp = { workspace = true }
convkit = { workspace = true }
devkit-mcp = { workspace = true }
studykit = { workspace = true }
study-mcp = { workspace = true }
formkit = { workspace = true }
buildkit-mcp = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
