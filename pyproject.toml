[project]
name = "custom-mcps"
version = "0"
description = "Personal collection of standalone, engine-agnostic MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pixellib", "pixelart-mcp"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[tool.uv.sources]
pixellib = { workspace = true }
pixelart-mcp = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
