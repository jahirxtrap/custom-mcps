[project]
name = "custom-mcps"
version = "0"
description = "Personal collection of standalone, engine-agnostic MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pixelart-mcp",
    "sfx-mcp",
    "modkit-mcp",
    "i18n-mcp",
    "devkit-mcp",
    "study-mcp",
    "buildkit-mcp",
    "uikit-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["servers/*"]

[tool.uv.sources]
pixelart-mcp = { workspace = true }
sfx-mcp = { workspace = true }
modkit-mcp = { workspace = true }
i18n-mcp = { workspace = true }
devkit-mcp = { workspace = true }
study-mcp = { workspace = true }
buildkit-mcp = { workspace = true }
uikit-mcp = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
