[project]
name = "study-mcp"
version = "0.3.0"
description = "Area-agnostic study MCP: anti-AI writing checks, LanguageTool grammar check, APA citations, concept maps, typeset PDFs and decks, free-image sourcing, workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "study", "academic", "apa", "fastmcp"]
dependencies = ["fastmcp>=3.4", "pillow>=11.0", "reportlab>=4.2"]

[project.scripts]
study-mcp = "study_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_mcp", "src/studykit"]
