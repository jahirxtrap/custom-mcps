[project]
name = "pixelart-mcp"
version = "0.1.0"
description = "Standalone, engine-agnostic MCP server to draw, inspect and verify pixel art."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "pixel-art", "sprites", "fastmcp"]
dependencies = ["fastmcp>=3.4", "pillow>=11.0", "pixellib"]

[project.scripts]
pixelart-mcp = "pixelart_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelart_mcp"]

[tool.uv.sources]
pixellib = { workspace = true }
