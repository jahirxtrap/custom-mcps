[project]
name = "buildkit-mcp"
version = "0.1.0"
description = "MCP for spec-driven low-poly 3D design: principles, references, preview, check, Godot def."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "3d", "low-poly", "godot", "fastmcp"]
dependencies = ["fastmcp>=3.4", "formkit"]

[project.scripts]
buildkit-mcp = "buildkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildkit_mcp"]

[tool.uv.sources]
formkit = { workspace = true }
