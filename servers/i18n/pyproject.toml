[project]
name = "i18n-mcp"
version = "0.2.2"
description = "Standalone, engine-agnostic MCP server to keep translation locales in sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "i18n", "translation", "locale", "fastmcp"]
dependencies = ["fastmcp>=3.4"]

[project.scripts]
i18n-mcp = "i18n_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i18n_mcp", "src/i18nkit"]
