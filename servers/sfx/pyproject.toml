[project]
name = "sfx-mcp"
version = "0.2.1"
description = "Standalone, engine-agnostic MCP server to synthesize sound effects by data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "sfx", "audio", "fastmcp", "synthesis"]
dependencies = ["fastmcp>=3.4", "numpy>=2.0", "pillow>=11.0", "soundfile>=0.12"]

[project.scripts]
sfx-mcp = "sfx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfx_mcp", "src/audiolib"]
