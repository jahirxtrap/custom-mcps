[project]
name = "devkit-mcp"
version = "0.1.0"
description = "MCP server for development conventions: 17 guide topics plus commit, hardcoding, spacing, format and duplication checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "conventions", "commits", "design-tokens", "fastmcp"]
dependencies = ["fastmcp>=3.4", "convkit"]

[project.scripts]
devkit-mcp = "devkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_mcp"]

[tool.uv.sources]
convkit = { workspace = true }
