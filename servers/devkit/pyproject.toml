[project]
name = "devkit-mcp"
version = "0.4.1"
description = "MCP server for development conventions: 17 guide topics, the core ones injected at session start, plus commit, hardcoding, spacing, format, duplication and comment checks, with a hook that warns when an edit adds comments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["mcp", "conventions", "commits", "design-tokens", "fastmcp"]
dependencies = ["fastmcp>=3.4"]

[project.scripts]
devkit-mcp = "devkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_mcp", "src/convkit"]
